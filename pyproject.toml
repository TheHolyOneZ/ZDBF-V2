[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zdbf"
version = "2.0.0"
description = "Zoryx Discord Bot Framework V2 - a modular discord.py framework built on Components V2"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSE-MARKETPLACE"]
authors = [{ name = "TheHolyOneZ" }]
requires-python = ">=3.12,<3.15"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "discord.py[voice]>=2.7.1,<2.8",
    "aiosqlite>=0.21",
    "aiohttp>=3.12",
    "aiofiles>=24.1",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0",
    "rich>=14.0",
    "psutil>=6.0",
    "cryptography>=45.0",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
zdbf = "zdbf.__main__:main"

[project.urls]
Homepage = "https://github.com/TheHolyOneZ/ZDBF-V2"
Marketplace = "https://zsync.eu/extension/"

[tool.setuptools.packages.find]
include = ["zdbf*"]

[tool.setuptools.package-data]
"zdbf.core" = ["*.toml"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF012", "B008", "ASYNC109", "ASYNC230", "ASYNC240"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning"]
