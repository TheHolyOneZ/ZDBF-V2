# ZDBF Dashboard on nginx. nginx ignores .htaccess, so these rules are required.
# Put them inside your server { } block and change /dashboard to your folder
# (use "location ^~ /app/" and "/data/" when the dashboard is the site root).

location ^~ /dashboard/app/  { deny all; return 404; }
location ^~ /dashboard/data/ { deny all; return 404; }
location ~ /\.               { deny all; return 404; }

location /dashboard/ {
    index index.php;
    try_files $uri $uri/ =404;
}

location ~ ^/dashboard/.+\.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass unix:/run/php/php-fpm.sock;
    # Live updates hold a request for about 20 seconds.
    fastcgi_read_timeout 60s;
    fastcgi_buffering off;
}

# Styles and scripts are checked with the server on every visit (a cheap "not modified"
# answer), so an updated dashboard shows up at once. Fonts may be kept for 30 days.
location ~* ^/dashboard/assets/.+\.(css|js|svg)$ {
    add_header Cache-Control "no-cache";
}

location ~* ^/dashboard/assets/.+\.woff2$ {
    add_header Cache-Control "public, max-age=2592000";
}
