name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, sqlite3, openssl, zlib
          coverage: none
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  dashboard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.1", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_sqlite, sqlite3, openssl, zlib
          coverage: none
      - name: PHP syntax
        run: find dashboard tests/dashboard tools -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHP checks
        run: php tests/dashboard/php/run.php
      - name: PHP rate limit under parallel requests
        run: php tests/dashboard/php/limits.php
      - name: JavaScript syntax
        run: find dashboard/assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
